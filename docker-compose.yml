services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MODEL_API_KEY=${MODEL_API_KEY:-}
      - MODEL_API_BASE_URL=${MODEL_API_BASE_URL:-https://api.openai.com/v1}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-gpt-4o-mini}
      - APP_AUTH_TOKEN=${APP_AUTH_TOKEN:-dev-token-change-me}
      - DATA_DIR=/data
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - agent_phone_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_APP_AUTH_TOKEN: ${APP_AUTH_TOKEN:-dev-token-change-me}
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  agent_phone_data:
